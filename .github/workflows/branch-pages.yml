name: Recover Pages using published branch
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Switch to generated gh-pages branch
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            await github.rest.repos.updateInformationAboutPagesSite({
              owner, repo, build_type: 'legacy', source: {branch: 'gh-pages', path: '/'}
            });
            core.info('Pages now uses gh-pages at the original project URL.');
            try {
              await github.rest.repos.requestPagesBuild({owner, repo});
            } catch (error) {
              if (![409, 422].includes(error.status)) throw error;
              core.info('A branch build is already queued.');
            }
