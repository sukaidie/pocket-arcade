name: Publish GitHub Pages branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-pages-branch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/package.mjs
      - name: Update generated gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          publish_directory=$(mktemp -d)
          git worktree add --detach "$publish_directory" origin/gh-pages
          git -C "$publish_directory" rm -r --ignore-unmatch .
          cp -R public/. "$publish_directory/"
          touch "$publish_directory/.nojekyll"
          git -C "$publish_directory" config user.name 'github-actions[bot]'
          git -C "$publish_directory" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$publish_directory" add --all
          if ! git -C "$publish_directory" diff --cached --quiet; then
            git -C "$publish_directory" commit -m "Publish source $GITHUB_SHA"
            git -C "$publish_directory" push origin HEAD:gh-pages
          fi
      - name: Request branch Pages build
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.requestPagesBuild(context.repo);
            } catch (error) {
              if (![409, 422].includes(error.status)) throw error;
              core.info('A Pages build is already queued.');
            }
