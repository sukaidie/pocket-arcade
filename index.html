ass="card-foot"><span>人机 / 房间联机</span><strong>开始玩 →</strong></div></button><button class="game-card rose" data-game="blackjack"><div class="card-top"><span>06 / 纸牌经典</span><span>↗</span></div><div class="mini blackjack-art">A♠ <span>K♥</span></div><h2>21点</h2><p>再来一张，还是见好就收？</p><div class="card-foot"><span>挑战庄家</span><strong>开始玩 →</strong></div></button></section><footer><span>✳ 快乐很小，随时装进口袋。</span><span>MADE FOR YOUR LITTLE BREAKS · 2026</span></footer></main><dialog id="player-dialog"><form id="player-form"><span class="eyebrow">READY TO PLAY?</span><h2 id="player-title" tabindex="-1" autofocus>这次是谁来挑战？</h2><label for="player-name">玩家昵称</label><input id="player-name" name="player" maxlength="20" required placeholder="输入你的名字" autocomplete="nickname" enterkeyhint="go"><p>成绩保存在当前浏览器，最佳纪录会显示你的名字。</p><div class="player-actions"><button type="button" id="cancel-player">取消</button><button type="submit">开始游戏 →</button></div></form></dialog><dialog id="game-dialog"><div class="modal-head"><div><span class="eyebrow">LET'S PLAY</span><h2 id="game-title"></h2></div><button id="close" class="icon-button" aria-label="关闭游戏">✕</button></div><p id="instructions"></p><div class="scorebar"><span id="status" role="status" aria-live="polite"></span><button id="restart">重新开始 ↻</button></div><div class="board-wrap"><div id="board"></div><div id="win-effects" aria-hidden="true"></div></div><div id="controls" aria-label="方向控制"></div><p class="hint" id="hint"></p><section id="room-chat" class="room-chat" hidden aria-label="房间聊天"><button id="chat-toggle" type="button" aria-expanded="false" aria-controls="chat-body">💬 房间聊天</button><div id="chat-body" hidden><div id="chat-messages" role="log" aria-label="聊天消息" aria-live="polite" aria-relevant="additions"></div><form id="chat-form"><label class="sr-only" for="chat-input">输入聊天消息</label><input id="chat-input" maxlength="200" placeholder="说点什么…（最多200字）" autocomplete="off" enterkeyhint="send"><button id="chat-send" type="submit">发送</button></form><
